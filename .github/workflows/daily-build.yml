name: Daily Build

on:
  # 每天 UTC 09:00、18:00 触发（北京时间 17:00、次日 02:00）
  # ⚠️ fork 仓库的 schedule 默认不会自动启用，需到 Actions 页面手动开启，
  #    且 60 天无活动会被自动禁用。日常自用直接用 workflow_dispatch 手动触发即可。
  schedule:
    - cron: '0 9,18 * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - uses: actions/checkout@v4
      - name: Check for recent commits
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$(git log --since='24 hours ago' --oneline)" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "过去 24 小时无新提交，跳过构建"
          fi

  build:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'jetbrains'
          java-version: '21'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install web-ui dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      # 用 env + printf 写入，避免 secret 中的 $ ` \ 等字符被 shell 二次解析
      - name: Prepare build files
        env:
          KEY_BASE64: ${{ secrets.KEY_BASE64 }}
          SIGNING_CONFIG: ${{ secrets.SIGNING_CONFIG }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          echo "$KEY_BASE64" | base64 -d > app/app.key
          printf '%s\n' "$SIGNING_CONFIG" > local.properties
          printf '%s\n' "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Gradle Build
        run: |
          chmod +x gradlew
          ./gradlew assembleGithubRelease

      # 额外留存一份到 Actions Artifacts，方便失败时取半成品排查；30 天后自动清理
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk-${{ github.run_id }}
          path: |
            app/build/outputs/apk/github/release/*.apk
            app/build/outputs/mapping/githubRelease/mapping.txt
          retention-days: 30

      # 固定 tag 覆盖发布，手机上直接点链接下载
      - name: Publish nightly prerelease
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: nightly
          name: Nightly Build
          prerelease: true
          body: |
            自动每日构建（commit `${{ github.sha }}`）

            > ⚠️ 开发版本，可能不稳定，仅供测试。
          files: |
            app/build/outputs/apk/github/release/*.apk
            app/build/outputs/mapping/githubRelease/mapping.txt