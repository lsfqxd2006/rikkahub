name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Check version
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION_NAME=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          if [ "$TAG" != "$VERSION_NAME" ]; then
            echo "::error::tag ($TAG) 与 versionName ($VERSION_NAME) 不一致"
            exit 1
          fi
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'jetbrains'
          java-version: '21'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install web-ui dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Prepare build files
        env:
          KEY_BASE64: ${{ secrets.KEY_BASE64 }}
          SIGNING_CONFIG: ${{ secrets.SIGNING_CONFIG }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          echo "$KEY_BASE64" | base64 -d > app/app.key
          printf '%s\n' "$SIGNING_CONFIG" > local.properties
          printf '%s\n' "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Build GitHub APK
        run: |
          chmod +x gradlew
          ./gradlew assembleGithubRelease

      - name: Prepare release assets
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/github/release/*-arm64-v8a-release.apk "dist/rikkahub-${VERSION}-arm64-v8a.apk"
          if ls app/build/outputs/apk/github/release/*-universal-release.apk >/dev/null 2>&1; then
            cp app/build/outputs/apk/github/release/*-universal-release.apk "dist/rikkahub-${VERSION}-universal.apk"
          fi
          cp app/build/outputs/mapping/githubRelease/mapping.txt "dist/mapping-${VERSION}.txt"
          (cd dist && zip -j "mapping-${VERSION}.zip" "mapping-${VERSION}.txt" && rm "mapping-${VERSION}.txt")
          ls -l dist

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          draft: true
          files: dist/*